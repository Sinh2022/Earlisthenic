name: Automated FREE AUDIO Sync to Fastly Edge CDN

on:
  schedule:
    # Runs every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Sync new audio from Google Drive
        run: |
          node scripts/sync-drive-cdn.js

      - name: Commit and Push new assets to Edge CDN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --staged --quiet; then
            echo "No audio changes to commit. Everything up to date."
          else
            git commit -m "chore(audio): sync new FREE AUDIO tracks from Google Drive [skip ci]"
            git push origin main
          fi
