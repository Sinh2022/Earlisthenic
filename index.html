<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Earlisthenic — Technical Ear Training & Psychoacoustic Frequency Analysis Studio">
  <meta name="theme-color" content="#191D19">
  <title>Earlisthenic — Linear-Phase Audio Ear Training</title>

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('earlisthenic_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved === 'dark' || (saved !== 'light' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- High-Performance DNS & TCP/TLS Preconnect Hints for Google Cloud Edge -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://accounts.google.com">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23B56D4E'/><path d='M25 65 L35 35 L45 70 L55 20 L65 75 L75 45' fill='none' stroke='%23FBF8F1' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F4F0E7;
      color: #171915;
    }
    html.dark, html.dark body {
      background-color: #191D19;
      color: #ECEBE2;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: transparent;
      pointer-events: auto;
    }
    #fb-iab-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999999;
      background: linear-gradient(90deg, #965438, #B56D4E);
      color: #FBF8F1;
      padding: 10px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 3px 12px rgba(0,0,0,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    #fb-iab-banner .banner-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #fb-iab-banner button {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #fb-iab-banner button:hover {
      background: rgba(255,255,255,0.35);
    }

    /* Fast-Load Studio Splash Screen */
    #studio-loader {
      position: fixed;
      inset: 0;
      background-color: #F4F0E7;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    html.dark #studio-loader {
      background-color: #191D19;
    }
    .studio-loader-title {
      color: #171915;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }
    html.dark .studio-loader-title {
      color: #ECEBE2;
    }
    .studio-loader-sub {
      color: #596052;
      font-family: monospace;
      font-size: 11px;
    }
    html.dark .studio-loader-sub {
      color: #A0A597;
    }
    .studio-loader-track {
      width: 130px;
      height: 3px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    html.dark .studio-loader-track {
      background: rgba(255, 255, 255, 0.08);
    }
    @keyframes studioPulse {
      0% { left: -40%; width: 30%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 30%; }
    }

    @media print {
      html, body {
        display: none !important;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

  <!-- Instant Studio Fast-Load Splash Screen -->
  <div id="studio-loader">
    <div style="width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#965438,#B56D4E);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(181,109,78,0.35);">
      <svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke="#FBF8F1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 65 L32 35 L44 70 L56 20 L68 75 L80 45" />
      </svg>
    </div>
    <div style="text-align:center;">
      <h1 class="studio-loader-title">EARLISTHENIC</h1>
      <p class="studio-loader-sub">Linear-Phase Audio Frequency Lab</p>
    </div>
    <div class="studio-loader-track">
      <div style="position:absolute;top:0;left:0;bottom:0;width:35%;background:linear-gradient(90deg,#B56D4E,#DFA58D);border-radius:999px;animation:studioPulse 1.1s infinite ease-in-out;"></div>
    </div>
  </div>

  <!-- Facebook In-App Browser Guidance Banner -->
  <div id="fb-iab-banner">
    <div class="banner-content">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:15px;">💡</span>
        <span>
          Đang mở trong trình duyệt Facebook. Để nghe nhạc FREE AUDIO lossless mượt mà không bị giới hạn mạng, hãy nhấn <strong>⋮</strong> (hoặc •••) ở góc trên và chọn <strong>"Mở bằng trình duyệt ngoài"</strong> (Chrome / Safari).
        </span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button type="button" onclick="openInExternalBrowser()">Mở Chrome</button>
        <button type="button" onclick="dismissFbBanner()">Đã hiểu</button>
      </div>
    </div>
  </div>

  <iframe 
    id="app-frame"
    loading="eager"
    fetchpriority="high"
    allow="accelerometer; ambient-light-sensor; autoplay; battery; bluetooth; camera; clipboard-read; clipboard-write; display-capture; document-domain; encrypted-media; execution-while-not-rendered; execution-while-out-of-viewport; fullscreen; gamepad; geolocation; gyroscope; hid; identity-credentials-get; idle-detection; local-fonts; magnetometer; microphone; midi; otp-credentials; payment; picture-in-picture; publickey-credentials-create; publickey-credentials-get; screen-wake-lock; serial; speaker-selection; storage-access; usb; web-share; window-management; xr-spatial-tracking"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    var gasBaseUrl = "https://script.google.com/macros/s/AKfycbzLHk2-SsGIXKgbRgHj9PYpCH9niiBTj08RlaBAk6Bt0ywygJUKtXec2POug46DR8H5/exec";

    // Detect Facebook In-App Browser
    var isFbIab = /FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(navigator.userAgent || '');
    if (isFbIab) {
      try {
        if (!sessionStorage.getItem('fb_banner_dismissed')) {
          var b = document.getElementById('fb-iab-banner');
          if (b) b.style.display = 'block';
        }
      } catch (e) {}
    }

    function dismissFbBanner() {
      var b = document.getElementById('fb-iab-banner');
      if (b) b.style.display = 'none';
      try { sessionStorage.setItem('fb_banner_dismissed', '1'); } catch (e) {}
    }

    function openInExternalBrowser() {
      var cleanUrl = "https://sinh2022.github.io/Earlisthenic/";
      if (/Android/i.test(navigator.userAgent)) {
        window.location.href = "intent://sinh2022.github.io/Earlisthenic/#Intent;scheme=https;package=com.android.chrome;end";
      } else {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cleanUrl).then(function() {
            alert("Đã sao chép liên kết: " + cleanUrl + "\nHãy dán vào Safari hoặc Chrome để trải nghiệm tốt nhất!");
          }).catch(function() {
            prompt("Sao chép liên kết sau để mở trong Safari/Chrome:", cleanUrl);
          });
        } else {
          prompt("Sao chép liên kết sau để mở trong Safari/Chrome:", cleanUrl);
        }
      }
    }

    // Strip tracking parameters to preserve edge caching on Google Apps Script
    var urlParams = new URLSearchParams(window.location.search || "");
    urlParams.delete("fbclid");
    urlParams.delete("mibextid");
    urlParams.delete("utm_source");
    urlParams.delete("utm_medium");
    urlParams.delete("utm_campaign");
    urlParams.delete("utm_content");
    urlParams.delete("utm_term");

    var cleanQuery = urlParams.toString();
    var hash = window.location.hash || "";
    var targetUrl = gasBaseUrl;
    if (cleanQuery) {
      targetUrl += (targetUrl.indexOf("?") === -1 ? "?" : "&") + cleanQuery;
    }
    // 5-minute bucketed cache tag: ensures fast CDN edge re-use while picking up deployments promptly
    var cacheBucket = "_v=2.10.11_" + Math.floor(Date.now() / 300000);
    targetUrl += (targetUrl.indexOf("?") === -1 ? "?" : "&") + cacheBucket;
    if (hash) {
      targetUrl += hash;
    }

    var appFrame = document.getElementById("app-frame");
    var isLoaderHidden = false;
    function hideLoader() {
      if (isLoaderHidden) return;
      isLoaderHidden = true;
      var loader = document.getElementById("studio-loader");
      if (loader) {
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 360);
      }
    }

    // High-speed immediate handshake: fade loader the instant Earlisthenic fires 'earlisthenic_ready'
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "earlisthenic_ready") {
        hideLoader();
      }
    });

    // Fallback safety watchdog: auto-hide splash only if handshake takes longer than 6.5s
    setTimeout(hideLoader, 6500);

    if (appFrame) {
      appFrame.src = targetUrl;
    }

    // Anti-screen capture clipboard clearing
    function clearClipboard() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText("").catch(function() {});
      }
    }

    window.addEventListener("keyup", function(e) {
      if (e.key === "PrintScreen" || e.keyCode === 44) {
        clearClipboard();
      }
    });

    window.addEventListener("keydown", function(e) {
      if (
        e.key === "PrintScreen" || e.keyCode === 44 ||
        (e.ctrlKey && (e.key === "p" || e.key === "P" || e.key === "s" || e.key === "S" || e.key === "u" || e.key === "U")) ||
        (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "C" || e.key === "c" || e.key === "J" || e.key === "j")) ||
        (e.metaKey && e.shiftKey && (e.key === "3" || e.key === "4" || e.key === "5")) ||
        e.key === "F12"
      ) {
        e.preventDefault();
        clearClipboard();
        return false;
      }
    });
  </script>
</body>
</html>
