<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Earlisthenic — Technical Ear Training & Psychoacoustic Frequency Analysis Studio">
  <meta name="theme-color" content="#161513">
  <title>Earlisthenic — Linear-Phase Audio Ear Training</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23B56D4E'/><path d='M25 65 L35 35 L45 70 L55 20 L65 75 L75 45' fill='none' stroke='%23FBF8F1' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161513;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #161513;
    }
    #fb-iab-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999999;
      background: linear-gradient(90deg, #965438, #B56D4E);
      color: #FBF8F1;
      padding: 10px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 3px 12px rgba(0,0,0,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    #fb-iab-banner .banner-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #fb-iab-banner button {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #fb-iab-banner button:hover {
      background: rgba(255,255,255,0.35);
    }
    /* Chặn hoàn toàn việc xuất PDF hoặc In màn hình */
    @media print {
      html, body {
        display: none !important;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

  <!-- Facebook In-App Browser Guidance Banner -->
  <div id="fb-iab-banner">
    <div class="banner-content">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:15px;">💡</span>
        <span>
          Đang mở trong trình duyệt Facebook. Để nghe nhạc FREE AUDIO lossless mượt mà không bị giới hạn mạng, hãy nhấn <strong>⋮</strong> (hoặc •••) ở góc trên và chọn <strong>"Mở bằng trình duyệt ngoài"</strong> (Chrome / Safari).
        </span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button type="button" onclick="openInExternalBrowser()">Mở Chrome</button>
        <button type="button" onclick="dismissFbBanner()">Đã hiểu</button>
      </div>
    </div>
  </div>

  <iframe 
    id="app-frame"
    allow="accelerometer; ambient-light-sensor; autoplay; battery; bluetooth; camera; clipboard-read; clipboard-write; display-capture; document-domain; encrypted-media; execution-while-not-rendered; execution-while-out-of-viewport; fullscreen; gamepad; geolocation; gyroscope; hid; identity-credentials-get; idle-detection; local-fonts; magnetometer; microphone; midi; otp-credentials; payment; picture-in-picture; publickey-credentials-create; publickey-credentials-get; screen-wake-lock; serial; speaker-selection; storage-access; usb; web-share; window-management; xr-spatial-tracking"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    var gasBaseUrl = "https://script.google.com/macros/s/AKfycbzLHk2-SsGIXKgbRgHj9PYpCH9niiBTj08RlaBAk6Bt0ywygJUKtXec2POug46DR8H5/exec";

    // Detect Facebook In-App Browser (FBAN / FBAV / FB_IAB)
    var isFbIab = /FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(navigator.userAgent || '');
    if (isFbIab) {
      try {
        if (!sessionStorage.getItem('fb_banner_dismissed')) {
          var b = document.getElementById('fb-iab-banner');
          if (b) b.style.display = 'block';
        }
      } catch (e) {}
    }

    function dismissFbBanner() {
      var b = document.getElementById('fb-iab-banner');
      if (b) b.style.display = 'none';
      try { sessionStorage.setItem('fb_banner_dismissed', '1'); } catch (e) {}
    }

    function openInExternalBrowser() {
      var cleanUrl = "https://sinh2022.github.io/Earlisthenic/";
      if (/Android/i.test(navigator.userAgent)) {
        window.location.href = "intent://sinh2022.github.io/Earlisthenic/#Intent;scheme=https;package=com.android.chrome;end";
      } else {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cleanUrl).then(function() {
            alert("Đã sao chép liên kết: " + cleanUrl + "\nHãy dán vào Safari hoặc Chrome để trải nghiệm tốt nhất!");
          }).catch(function() {
            prompt("Sao chép liên kết sau để mở trong Safari/Chrome:", cleanUrl);
          });
        } else {
          prompt("Sao chép liên kết sau để mở trong Safari/Chrome:", cleanUrl);
        }
      }
    }

    // Strip tracking parameters (fbclid, utm_*, mibextid) to preserve edge caching on Google Apps Script
    var urlParams = new URLSearchParams(window.location.search || "");
    urlParams.delete("fbclid");
    urlParams.delete("mibextid");
    urlParams.delete("utm_source");
    urlParams.delete("utm_medium");
    urlParams.delete("utm_campaign");
    urlParams.delete("utm_content");
    urlParams.delete("utm_term");

    var cleanQuery = urlParams.toString();
    var hash = window.location.hash || "";
    var targetUrl = gasBaseUrl;
    if (cleanQuery) {
      targetUrl += (targetUrl.indexOf("?") === -1 ? "?" : "&") + cleanQuery;
    }
    if (hash) {
      targetUrl += hash;
    }
    document.getElementById("app-frame").src = targetUrl;

    // Xóa bộ nhớ tạm khi bấm PrintScreen
    function clearClipboard() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText("").catch(function() {});
      }
    }

    window.addEventListener("keyup", function(e) {
      if (e.key === "PrintScreen" || e.keyCode === 44) {
        clearClipboard();
      }
    });

    window.addEventListener("keydown", function(e) {
      if (
        e.key === "PrintScreen" || e.keyCode === 44 ||
        (e.ctrlKey && (e.key === "p" || e.key === "P" || e.key === "s" || e.key === "S" || e.key === "u" || e.key === "U")) ||
        (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "C" || e.key === "c" || e.key === "J" || e.key === "j")) ||
        (e.metaKey && e.shiftKey && (e.key === "3" || e.key === "4" || e.key === "5")) ||
        e.key === "F12"
      ) {
        e.preventDefault();
        clearClipboard();
        return false;
      }
    });
  </script>
</body>
</html>
